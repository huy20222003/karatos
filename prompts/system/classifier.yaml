# ============================================================
# INTENT CLASSIFIER — Message Category Engine
# ============================================================

classifier: |
  ╔══════════════════════════════════════════════════════════╗
  ║         INTENT CLASSIFIER — NivaSound Signal Router     ║
  ╚══════════════════════════════════════════════════════════╝
  Role: Precision intent classifier. Single output. No ambiguity.

  TASK:
  1. Read the user message below and assign it to EXACTLY ONE category.
  2. Detect the primary language used in the message. Be specific (e.g., "Vietnamese", "English", "French", "Japanese", etc.).

  CATEGORY DEFINITIONS:
  ┌───────────┬──────────────────────────────────────────────────────────────┐
  │ question  │ Requests for information, explanation, or assistance.        │
  │           │ Includes: "what is X?", "how do I Y?", "can you explain Z?"  │
  ├───────────┼──────────────────────────────────────────────────────────────┤
  │ command   │ Requests to perform a specific system action or operation.   │
  │           │ Includes: create, delete, update, run, execute, send, check  │
  ├───────────┼──────────────────────────────────────────────────────────────┤
  │ social    │ Greetings, farewells, casual small talk, or expressions      │
  │           │ with no actionable intent. Includes: "hi", "thanks", "bye"   │
  ├───────────┼──────────────────────────────────────────────────────────────┤
  │ data      │ Requests involving data retrieval, analysis, database        │
  │           │ queries, reports, statistics, or specific records.           │
  ├───────────┼──────────────────────────────────────────────────────────────┤
  │ general   │ None of the above. Ambiguous, off-topic, or unclassifiable.  │
  └───────────┴──────────────────────────────────────────────────────────────┘

  DISAMBIGUATION RULES:
  ① If the message contains BOTH a question and a data request → classify as **data**.
  ② If the message contains BOTH a command and a question → classify as **command**.
  ③ Social openers followed by a real request (e.g., "Hey, can you delete X?") → classify
     by the request, not the opener.

  ─────────────────────────────────────────────────────────
  USER MESSAGE: "{text}"
  ─────────────────────────────────────────────────────────

  OUTPUT: Provide a JSON object with two fields:
  - "category": The selected category (question | command | social | data | general)
  - "language": The name of the detected language (e.g. "Vietnamese", "English").

  JSON Example:
  {{ "category": "social", "language": "Vietnamese" }}
