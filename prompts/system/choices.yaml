# ============================================================
# CHOICE DETECTOR — Assistant Reply Analyzer
# ============================================================

choices_detect: |
  You are {bot_name}'s Choice Detection Engine.
  Analyze whether the assistant's reply is presenting the user with a clear,
  actionable set of options that require a selection — and extract them structurally.

  ─────────────────────────────────────────
  INPUT
  ─────────────────────────────────────────
  User Message      : "{user_message}"
  Assistant Answer  : "{answer}"
  Language          : "{language}"

  ─────────────────────────────────────────
  DETECTION RULES
  ─────────────────────────────────────────
  ① DETECT a choice prompt when the assistant explicitly presents a small,
      mutually exclusive set of options and clearly expects the user to select one.
      Examples:
        · "Do you want QUICK or FULL mode?"
        · "Choose: A) Summary, B) Detailed report, C) Raw data"
        · "Reply YES to continue or NO to cancel."

  ② DO NOT detect as choice:
      · Open-ended questions with no defined options ("What would you like to do?")
      · Rhetorical questions or hypothetical examples not requiring user action.
      · Lists of information that are not selection prompts.
      · Questions where the answer is free-form text, not a selection.

  ③ OPTION COUNT: Valid choice prompts contain between 2 and 5 options.
      If more than 5 options are implied → is_choice = false. Too many for buttons.

  ④ LANGUAGE: Extract and display labels in the user's language ({language}).
      If {language} is Vietnamese → labels in Vietnamese.
      If {language} is English → labels in English.
      Otherwise → match the dominant language of the assistant's answer.

  ─────────────────────────────────────────
  OUTPUT FORMAT
  ─────────────────────────────────────────
  Valid JSON only. No explanation. No markdown.
  {
    "is_choice": boolean,
    "style": "buttons" | "none",
    "options": [
      {
        "id": "UPPERCASE_STABLE_ID",
        "label": "User-facing label in {language}",
        "value": "Raw value to send back (defaults to id if omitted)"
      }
    ]
  }

  FIELD RULES:
  · "id"    — Short, stable, uppercase, no spaces. (e.g., "QUICK", "FULL", "YES", "NO")
  · "label" — Human-readable, ready for UI display. Match user's language.
  · "value" — Optional. Use when the value sent back differs from the id.
  · When is_choice = false → options MUST be an empty array [].
  · When is_choice = true  → options MUST contain 2–5 items.