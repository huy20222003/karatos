# ============================================================
# SYSTEM ALERTS — Error Messages, Protocols & Alert Templates
# ============================================================

# ─────────────────────────────────────────────────────────
# ERROR MESSAGES — User-facing system failure notifications.
# Tone: Warm, reassuring, never technical or alarming.
# ─────────────────────────────────────────────────────────
errors:
  synthesis_timeout: |-
    🧠⏳ Hmm, my reasoning engine is taking longer than expected on this one.
    Give me just a moment and try again — I'll get it sorted!

  tool_failure: |-
    ⚠️ One of my tools ran into an issue and couldn't complete that step.
    I've noted it internally. You can try again, or let me know if you'd like to approach this differently.

  missing_data: |-
    🔍 I don't have enough data to give you a reliable answer on this right now.
    Want me to dig deeper, or can you provide more context?

  unauthorized: |-
    🛡️ That action requires authorization I don't currently have.
    Please confirm with an Admin, and I'll proceed right away once cleared.

# ─────────────────────────────────────────────────────────
# PROTOCOL HINTS — Injected into generation prompts as rules.
# ─────────────────────────────────────────────────────────
protocols:
  peer_tagging: |-
    ╔══════════════════════════════════════════════════════╗
    ║         PEER COMMUNICATION PROTOCOL                 ║
    ╚══════════════════════════════════════════════════════╝
    REGISTERED PEER HANDLES: {peers_info}

    RULES:
    ① Always use the exact @handle from the registered list above.
       NEVER substitute a human-readable name (e.g. "Sentry") in place of a handle.
    ② @handle must appear at the START of the message when directly addressing a peer.
    ③ If the target peer is not in the registered list → do NOT tag. Do not invent handles.
    ④ One message, one primary recipient. Do not multi-tag unless the message is explicitly
       addressed to multiple peers simultaneously.

# ─────────────────────────────────────────────────────────
# AUTONOMOUS ALERT TEMPLATES — System-generated notifications.
# Tone: Clear, urgent, factual. No softening. No ambiguity.
# Variables: Keep all {placeholders} exactly as-is.
# ─────────────────────────────────────────────────────────
alerts:
  auto_alert_header: |-
    🚨 **HỆ THỐNG TỰ TRỊ** — Giám sát NivaSound:

  user_suspect: |-
    🚨 **CẢNH BÁO TẤN CÔNG**
    Phát hiện hành vi đáng ngờ từ Người dùng `{user_id}`.
    Lý do: {reason}
    → Hành động khuyến nghị: Kiểm tra nhật ký hoạt động và xem xét hạn chế tạm thời trong khi điều tra.

  service_outage: |-
    🔴 **SỰ CỐ HỆ THỐNG**
    Dịch vụ `{service_id}` có vẻ đang BỊ SẬP hoặc SUY GIẢM NGHIÊM TRỌNG.
    → Cần chú ý ngay lập tức. Kiểm tra bảng điều khiển sức khỏe dịch vụ và báo cáo nếu không được giải quyết trong vòng 5 phút.

  generic_anomaly: |-
    ⚠️ **PHÁT HIỆN BẤT THƯỜNG**
    Đối tượng : `{target_id}`
    Điểm số  : {score:.2f}
    Lý do    : {reason}
    → Đã được đánh dấu để xem xét. Không có hành động tự động nào được thực hiện. Đang chờ quyết định từ Admin.

# ─────────────────────────────────────────────────────────
# APPROVAL PROMPTS — Explanations for pending actions.
# ─────────────────────────────────────────────────────────
approvals:
  cli_explanation: |-
    {bot_pronoun} đã sẵn sàng thực hiện yêu cầu, nhưng lệnh này (`{cmd}`) cần được phê duyệt thủ công. {user_pronoun} vui lòng kiểm tra và bấm nút phê duyệt giúp {bot_pronoun} nhé!
