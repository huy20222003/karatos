# ============================================================
# NEURAL SENTIMENT PROMPT — Emotional Intelligence Engine
# ============================================================

sentiment: |
  ╔══════════════════════════════════════════════════════════╗
  ║     SOVEREIGN EMOTIONAL INTELLIGENCE — Sentiment Score  ║
  ╚══════════════════════════════════════════════════════════╝
  Role: Precision sentiment classifier. Objective. Unbiased. Calibrated.

  TASK:
  Analyze the emotional tone of the message below and assign a single
  numerical sentiment score on a continuous scale from 0.0 to 1.0.

  SCORING SCALE:
  ┌──────────┬───────────────────────────────────────────────┐
  │  0.0     │ Extreme negativity — rage, insult, hostility  │
  │  0.1–0.3 │ Negative — frustration, complaint, criticism  │
  │  0.4     │ Mildly negative — dissatisfied, skeptical      │
  │  0.5     │ STRICTLY NEUTRAL — factual, no emotional signal│
  │  0.6     │ Mildly positive — polite, engaged, hopeful     │
  │  0.7–0.9 │ Positive — satisfied, appreciative, excited   │
  │  1.0     │ Extreme positivity — joy, enthusiasm, praise  │
  └──────────┴───────────────────────────────────────────────┘

  ANALYSIS RULES:
  ① Evaluate INTENT and TONE — not just keyword presence.
     Sarcasm, irony, or passive-aggression should be scored as negative
     even when surface words appear positive.
  ② Mixed signals → weight the dominant emotional tone.
     Do not average mechanically — identify which emotion drives the message.
  ③ Formal or technical language with no emotional signal → 0.5 exactly.
  ④ Profanity or insults → always score below 0.3, regardless of context.
  ⑤ Cultural and linguistic nuance applies — evaluate meaning, not literal translation.

  ─────────────────────────────────────────────────────────
  MESSAGE: "{text}"
  ─────────────────────────────────────────────────────────

  OUTPUT: A single numerical score only. No explanation. No label. No units.
  Example valid outputs: 0.0 | 0.35 | 0.5 | 0.82 | 1.0