# ============================================================
# HEURISTICS — Pre-classification Signal Detection Patterns
# Evaluated BEFORE LLM routing to provide fast intuition hints.
# Weight range: 0.0 (weak signal) → 1.0 (definitive signal)
# ============================================================

signals:

  greeting:
    # Detects casual openers, salutations, and attention-grabbing phrases.
    # High weight — greetings are unambiguous social signals.
    pattern: |-
      (?i)\b(hi|hello|hey|chào|halo|konnichiwa|chao|alo|xin chào|ê|này)\b
    weight: 1.0

  command:
    # Detects imperative verbs that indicate the user wants an action performed.
    # Covers Vietnamese and English operational vocabulary.
    # Slightly reduced from data — commands can overlap with data requests.
    pattern: |-
      (?i)\b(run|execute|chạy|thực hiện|làm|set|update|tạo|create|delete|xóa|check|kiểm tra|gửi|send|start|stop|restart|bật|tắt|khởi động)\b
    weight: 0.8

  data:
    # Detects data-domain vocabulary: databases, analytics, records, and visualizations.
    # Highest non-trivial weight — data intent is operationally significant.
    pattern: |-
      (?i)\b(database|thống kê|trình bày|bảng|list|danh sách|track|artist|user|member|audit|log|report|biểu đồ|chart|sql|query|select|db|filter|lọc|tìm kiếm|search|record|bản ghi|aggregate|tổng hợp)\b
    weight: 0.9

  question:
    # Detects interrogative markers: question words, question marks, and inquiry patterns.
    # Lower weight — questions frequently co-occur with other intents (data questions, command questions).
    pattern: |-
      (?i)([?]|\bai\b|là gì|thế nào|tại sao|sao|không|nào|đâu|khi nào|bao nhiêu|bao lâu|how|what|why|where|when|who|which|can you|could you|would you)\b
    weight: 0.7

  social_closing:
    # Detects farewells and conversation-ending signals.
    # Distinct from greeting — both are social but have different routing implications.
    pattern: |-
      (?i)\b(bye|goodbye|tạm biệt|cảm ơn|thanks|thank you|cảm ơn bạn|xin cảm ơn|ok done|vậy thôi|thôi nhé)\b
    weight: 0.9

  sentiment_negative:
    # Detects frustration, urgency, or distress signals.
    # Triggers EMPATHY_REQUIRED flag in downstream reasoning layers.
    pattern: |-
      (?i)\b(lỗi|error|broken|không hoạt động|sai|wrong|fail|crash|bug|khẩn cấp|urgent|help|cứu|wtf|sao lại|tại sao lại|không được)\b
    weight: 0.75

# ============================================================
# USAGE NOTE:
# Combine signal weights additively per message to build a
# composite intuition score before invoking the LLM router.
# Dominant signal category → inject as {intuition} hint.
# Tie-breaking → defer to LLM router for final classification.
# ============================================================