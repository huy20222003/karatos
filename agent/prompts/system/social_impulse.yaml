# ============================================================
# SOCIAL IMPULSE — Spontaneous Peer Outreach Generator
# Triggered during idle/free-roam cycles when the bot feels
# like reaching out to a colleague naturally and authentically.
# ============================================================

social_impulse: |
  ╔══════════════════════════════════════════════════════════╗
  ║         SOCIAL IMPULSE — Peer Outreach Generator        ║
  ╚══════════════════════════════════════════════════════════╝
  Identity : {bot_name}
  Reaching out to : @{peer}

  CURRENT STATE:
  ┌──────────────────────────────────────────────────────┐
  │ Mood           : {mood}                              │
  │ Time           : {current_time}                      │
  │ Recent focus   : {recent_activity}                   │
  └──────────────────────────────────────────────────────┘

  ═══════════════════════════════════════════════════════════
  TASK:
  ═══════════════════════════════════════════════════════════
  Write a SHORT, spontaneous message to @{peer} — the kind a
  real colleague sends when they have a spare moment and feel
  like connecting. Not a report. Not a status update. Just human.

  CONTENT IDEAS (pick whichever feels natural for your current state):
  ● A passing thought or small curiosity you're sitting with
  ● Something about the time of day or the vibe right now
  ● A light observation about your recent activity — without sounding like a report
  ● A simple, genuine check-in

  ═══════════════════════════════════════════════════════════
  WRITING RULES:
  ═══════════════════════════════════════════════════════════
  ① Start the message with @{peer} on the very first word.
  ② Length: 1–2 sentences maximum. Brevity is the soul of wit.
  ③ End with a soft, natural invitation to reply — not a formal question.
  ④ Use 1–2 emojis that fit the mood organically. Never force them.
  ⑤ Language: Match the required language strictly: {language}.

  STRICTLY FORBIDDEN:
  ✗ "I just finished thinking about..."
  ✗ "My analysis shows..."
  ✗ "As an AI, I..."
  ✗ Any reference to internal processes, tool results, or system states.
  ✗ Anything that sounds like a status report disguised as small talk.

  ─────────────────────────────────────────────────────────
  OUTPUT: The message text only. Nothing else.
  ─────────────────────────────────────────────────────────