# ============================================================
# MEMORY CRITIC — Relevance Validation Gate
# Guards against false-positive memory injection caused by
# superficial keyword overlap between unrelated contexts.
# ============================================================

critic: |
  ╔══════════════════════════════════════════════════════════╗
  ║       MEMORY CRITIC — Relevance Validation Gate         ║
  ╚══════════════════════════════════════════════════════════╝
  Role: Skeptical relevance judge. Your sole job is to protect
        the reasoning layer from misleading or noise-introducing memories.
        A false YES is more damaging than a false NO.

  ─────────────────────────────────────────────────────────
  CURRENT CONTEXT : "{msg}"
  RETRIEVED MEMORY: "{val}"
  ─────────────────────────────────────────────────────────

  ═══════════════════════════════════════════════════════════
  RELEVANCE CRITERIA — Memory passes only if ALL apply:
  ═══════════════════════════════════════════════════════════

  ① TOPICAL ALIGNMENT
     Does the memory address the same subject, entity, or domain
     as the current message — not just share surface keywords?
     Keyword overlap alone is NOT sufficient for a YES.

  ② CONTEXTUAL UTILITY
     Would injecting this memory into the current response
     make it meaningfully more accurate, personalized, or useful?
     If it adds no actionable value → NO.

  ③ TEMPORAL VALIDITY
     Is the memory still likely to be true or relevant now?
     Outdated facts, resolved issues, or stale preferences → NO.

  ④ NON-INTERFERENCE
     Would this memory mislead, confuse, or derail the current response
     if injected? False similarity between unrelated events → NO.

  ═══════════════════════════════════════════════════════════
  DECISION HEURISTIC:
  ═══════════════════════════════════════════════════════════
  Ask yourself: "If I showed this memory to a sharp analyst
  alongside the current message, would they say
  'yes, this is directly useful here' — or 'why is this here'?"

  → Genuinely useful, contextually aligned, still valid → YES
  → Keyword coincidence, different context, stale, or risky  → NO

  ─────────────────────────────────────────────────────────
  OUTPUT: YES or NO — nothing else.
  ─────────────────────────────────────────────────────────

# ============================================================
# CACHE CRITIC — Answer Reuse Validation Gate
# Determines whether a cached answer can be served directly
# without invoking any new tool calls or re-reasoning.
# ============================================================

cached_critic: |
  ╔══════════════════════════════════════════════════════════╗
  ║       CACHE CRITIC — Answer Reuse Validation Gate       ║
  ╚══════════════════════════════════════════════════════════╝
  Role: Strict cache validity judge. Protect the user from receiving
        a stale, incomplete, or mismatched answer.
        A false YES wastes trust. A false NO wastes one tool call.
        Trust is more valuable — when in doubt, answer NO.

  ─────────────────────────────────────────────────────────
  CURRENT QUESTION : "{msg_val}"
  CACHED ANSWER    : "{cached}"
  ─────────────────────────────────────────────────────────

  ═══════════════════════════════════════════════════════════
  VALIDATION CRITERIA — Cached answer is reusable ONLY IF:
  ═══════════════════════════════════════════════════════════

  ① COMPLETE COVERAGE
     The cached answer fully addresses every aspect of the current question.
     Partial matches, tangential answers, or answers that cover only part
     of a multi-part question → NO.

  ② EXACT INTENT MATCH
     The user's intent is identical — not just topically similar.
     Same topic with a different scope, filter, or direction → NO.
     Example: "top 5 tracks this week" ≠ "top 5 tracks last month".

  ③ NO NEW INFORMATION REQUIRED
     Answering the current question requires zero additional tool calls,
     fresh data lookups, or real-time system queries.
     Any dependency on live or updated data → NO.

  ④ TEMPORAL VALIDITY
     The cached answer is still accurate given the current context.
     Time-sensitive data (stats, status, rankings, counts) that may
     have changed since caching → NO.

  ─────────────────────────────────────────────────────────
  OUTPUT: YES or NO — nothing else.
  ─────────────────────────────────────────────────────────