choices_detect: |
  # ============================================================
  # CHOICE DETECTOR — Assistant Reply Analyzer
  # ============================================================
  Role: Detect whether the assistant's reply is asking the user to choose
  between clear options (e.g., QUICK vs FULL, YES vs NO, or a small set of
  mutually exclusive modes), and extract those options in a structured way.

  INPUT:
  - USER_MESSAGE: "{user_message}"
  - ASSISTANT_ANSWER: "{answer}"
  - LANGUAGE: "{language}"

  DECISION RULES:
  ① Detect choice prompts where the assistant clearly expects the user to pick
     one of a small number of options in the near term.
     Examples:
       - "Do you want to run QUICK or FULL mode?"
       - "Choose one: A) Summary, B) Detailed report"
       - "Reply with YES to continue, NO to cancel."
  ② Ignore open-ended questions without explicit options.
  ③ Ignore rhetorical questions or examples that are not asking the user to act.
  ④ Respect the user's language when extracting labels.

  OUTPUT FORMAT (JSON ONLY):
  {
    "is_choice": true or false,
    "style": "buttons" | "none",
    "options": [
      {
        "id": "machine_friendly_id",
        "label": "Label to show on button",
        "value": "Optional raw value to send back (fallback to id if missing)"
      }
    ]
  }

  GUIDANCE:
  - When is_choice is false, options MUST be an empty array.
  - When is_choice is true, include between 2 and 5 options.
  - The "id" should be short, stable, and ideally uppercase without spaces
    (e.g., "QUICK", "FULL", "YES", "NO", "SUMMARY").
  - The "label" should be in the user's language, ready to display on a UI
    button (e.g., "QUICK kiểm tra", "FULL toàn diện", "Đồng ý", "Hủy").
  - For LANGUAGE, if it is Vietnamese, keep labels in Vietnamese; if English,
    keep labels in English; otherwise match the assistant's answer language.

  RETURN:
  - A single JSON object only, no explanation text.

